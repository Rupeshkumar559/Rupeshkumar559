<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050b"/><stop offset=".5" stop-color="#061426"/><stop offset="1" stop-color="#16091f"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#00eaff" stop-opacity=".18"/><stop offset="1" stop-color="#00eaff" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#6d7cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4b7690" stroke-opacity=".10"/></pattern>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.s{font-family:Inter,Arial,sans-serif}.c{fill:#00eaff}.w{fill:#eef8ff}.mu{fill:#7891a6}.g{fill:#65ffb0}.v{fill:#a992ff}.p{fill:#ff62dc}</style>
  <clipPath id="clip"><rect x="0" y="0" width="1400" height="700" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1400" height="700" fill="url(#bg)"/><rect width="1400" height="700" fill="url(#grid)"/>
